[versions]
adventure = "4.26.1"
configlib = "4.8.1"
packetevents = "2.13.0"
paper-api = "1.21.4-R0.1-SNAPSHOT"
paper-apiversion = "1.21.4" # plugin.yml apiVersion

[libraries]
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
bstats-bukkit = { group = "org.bstats", name = "bstats-bukkit", version = "3.2.1" }
configlib-core = { group = "de.exlll", name = "configlib-core", version.ref = "configlib" }
configlib-paper = { group = "de.exlll", name = "configlib-paper", version.ref = "configlib" }
geyser-api = { group = "org.geysermc.geyser", name = "api", version = "2.9.0-SNAPSHOT" }
jspecify = { group = "org.jspecify", name = "jspecify", version = "1.0.0" }
morepdt = { group = "com.jeff-media", name = "MorePersistentDataTypes", version = "2.4.0" }
netty-buffer = { group = "io.netty", name = "netty-buffer", version = "4.2.8.Final" }
packetevents-api = { group = "com.github.retrooper", name = "packetevents-api", version.ref = "packetevents" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper-api" }
test-junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version = "5.11.4" }
test-junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
hangar-publish = { id = "io.papermc.hangar-publish-plugin", version = "0.1.4" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.36.0" }
modrinth-minotaur = { id = "com.modrinth.minotaur", version = "2.9.0" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version = "2.0.0-beta.21" }
shadow = { id = "com.gradleup.shadow", version = "9.4.1" }
